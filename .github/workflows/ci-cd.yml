# ============================================================
# NOME DO WORKFLOW
# ============================================================
name: CI/CD Pipeline


# ============================================================
# TRIGGERS
# ============================================================
on:
  push:
    branches: [main, 'release*']
  pull_request:
    branches: [main]
  workflow_dispatch:


# ============================================================
# PERMISSIONS
# ============================================================
permissions:
  contents: read


# ============================================================
# CONCURRENCY
# ============================================================
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true


jobs:

  # ==========================================================
  # JOB 1 — TEST
  # ==========================================================
  # Em vez de definir os steps aqui, este job apenas CHAMA
  # o workflow reutilizável criado em reusable-test.yml.
  #
  # "uses:" aponta para o caminho do arquivo dentro do mesmo
  # repositório. O GitHub executa a matrix (Node 18/20/24)
  # como se fosse parte deste mesmo pipeline.
  test:
    name: Build & Test
    uses: ./.github/workflows/reusable-test.yml


  # ==========================================================
  # JOB 2 — DEPLOY
  # ==========================================================
  deploy:
    name: Deploy to GitHub Pages
    needs: test
    if: startsWith(github.ref, 'refs/heads/release') && github.event_name == 'push'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject build info into index.html
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          BUILD_DATE="$(date -u '+%Y-%m-%d %H:%M UTC')"

          sed -i "s/{{COMMIT_SHA}}/${SHORT_SHA}/" index.html
          sed -i "s/{{RUN_NUMBER}}/${{ github.run_number }}/" index.html
          sed -i "s/{{BUILD_DATE}}/${BUILD_DATE}/" index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4